<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="#FAFAFA"/>
  
  <!-- Geometric Structure -->
  <g stroke="#5B3A8F" stroke-width="0.5" fill="none" opacity="0.4">
    <!-- Diamond Lattice -->
    <path d="M32 0 L64 32 L32 64 L0 32 Z" />
    <path d="M-32 0 L0 32 L-32 64 L-64 32 Z" /> <!-- Left overlap -->
    <path d="M96 0 L128 32 L96 64 L64 32 Z" /> <!-- Right overlap -->
    
    <!-- Inner Crosses -->
    <path d="M32 0 L32 64" />
    <path d="M0 32 L64 32" />
    
    <!-- Diagonals -->
    <path d="M0 0 L64 64" />
    <path d="M64 0 L0 64" />
    
    <!-- Circles -->
    <circle cx="32" cy="32" r="12" />
    <circle cx="0" cy="0" r="12" />
    <circle cx="64" cy="0" r="12" />
    <circle cx="0" cy="64" r="12" />
    <circle cx="64" cy="64" r="12" />
  </g>

  <!-- Accents -->
  <g fill="#2D1B4E" opacity="0.5">
    <circle cx="32" cy="32" r="1.5" />
    <circle cx="32" cy="12" r="1" />
    <circle cx="32" cy="52" r="1" />
    <circle cx="12" cy="32" r="1" />
    <circle cx="52" cy="32" r="1" />
  </g>
</svg>
